name: Deploy demo to Pages

# Publishes a clickable build for Carlos.
#
# Never runs on its own from ordinary work: only on a `g1-v*` tag, or when
# someone runs it by hand. It also goes through the `github-pages`
# environment, so adding required reviewers there makes every deploy need an
# explicit approval, whoever pushed the tag.
#
# The build is deliberately not the normal production one. It uses
# `.env.demo`, which switches the C1 prompt on and blanks every write path to
# Excalidraw's own infrastructure — see that file for why.

on:
  push:
    tags:
      - "g1-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or SHA to build and publish"
        required: false
        default: "main"

permissions:
  contents: read

# One deploy at a time. A queued run is not cancelled: half-publishing a site
# is worse than publishing a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # Project Pages serve under /<repo>/, so the base path has to match or
      # every asset 404s. Taken from the repo name rather than hardcoded.
      - name: Build demo
        run: yarn --cwd excalidraw-app vite build --mode demo --base=/${{ github.event.repository.name }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: excalidraw-app/build

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Summary
        run: |
          {
            echo "### Demo published"
            echo ""
            echo "**${{ steps.deploy.outputs.page_url }}**"
            echo ""
            echo "Built from \`${{ inputs.ref || github.ref_name }}\`."
            echo ""
            echo "This build is not production Excalidraw: the C1 save prompt is"
            echo "switched on, and share links, live collaboration and analytics"
            echo "are disabled so nothing writes to Excalidraw's own services."
          } >> "$GITHUB_STEP_SUMMARY"
