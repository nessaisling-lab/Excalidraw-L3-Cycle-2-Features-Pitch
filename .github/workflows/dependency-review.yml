name: Dependency review

# Checks dependencies a pull request *adds or changes* against GitHub's
# advisory database. It looks only at the diff, so the large inherited
# dependency tree is not re-litigated on every PR — a vulnerable package is
# flagged at the moment someone introduces it, which is when it is cheap to
# reconsider.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  review:
    name: Review changed dependencies
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # needed for comment-summary-in-pr below
      pull-requests: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Start at `high` so an inherited-tree bump doesn't block a routine
          # dependency-pin PR on a moderate advisory. Tighten to `moderate`
          # once we have seen how noisy this is in practice.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
